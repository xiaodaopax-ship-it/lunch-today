<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3241f">
<title>今天吃什么</title>
<style>
:root{--red:#b3241f;--gold:#c8952a;--ink:#2b2118;--ink2:#6b5c4d;
 --line:#e6dcc8;--paper:#fffdf8;--cream:#fdf7e9;--bg:#f7f2e6;
 --ok:#2e7d5b;--bad:#b8442e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:15px/1.65 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
 -webkit-text-size-adjust:100%}
/* padding-top 必须把状态栏高度加进去：meta 里写了 viewport-fit=cover，
   页面会铺到刘海底下，不加 env(safe-area-inset-top) 标题会被时间和
   信号图标压住。 */
header{background:var(--red);color:#fff;display:flex;
 padding:calc(13px + env(safe-area-inset-top)) 16px 13px;
 align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header b{font-size:17px;letter-spacing:2px}
header span{font-size:12px;opacity:.85}
main{max-width:640px;margin:0 auto;
 padding:14px 12px calc(40px + env(safe-area-inset-bottom))}

/* ---- 老黄历，做传统日历的样子 ---- */
.alm{background:var(--paper);border:1px solid var(--line);border-radius:16px;
 overflow:hidden;margin-bottom:14px;box-shadow:0 4px 14px rgba(43,33,24,.07)}
.alm .top{background:var(--red);color:#fff;padding:7px 14px;font-size:12.5px;
 display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.alm .mid{display:flex;align-items:stretch}
.alm .col{flex:1;padding:12px 10px;text-align:center;font-size:12.5px;
 color:var(--ink2);display:flex;flex-direction:column;justify-content:center;gap:3px}
.alm .day{flex:0 0 108px;background:var(--cream);border-left:1px solid var(--line);
 border-right:1px solid var(--line);display:flex;flex-direction:column;
 align-items:center;justify-content:center;padding:10px 6px}
.alm .day .n{font:700 42px/1 Georgia,serif;color:var(--red)}
.alm .day .w{font-size:12px;color:var(--ink2);margin-top:3px}
.alm .tone{text-align:center;padding:8px 14px;font-size:13.5px;
 border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);
 background:#fffef9}
.yiji{display:flex}
.yiji>div{flex:1;padding:10px 12px;font-size:12.5px}
.yiji>div+div{border-left:1px solid var(--line)}
.yiji h4{margin:0 0 5px;font-size:13px}
.yiji .y h4{color:var(--ok)} .yiji .j h4{color:var(--bad)}
.yiji li{list-style:none;margin:0 0 3px;padding-left:11px;position:relative}
.yiji li:before{content:'·';position:absolute;left:2px}
.alm .foot{background:var(--cream);padding:7px 14px;font-size:11.5px;
 color:var(--ink2);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
 border-top:1px solid var(--line)}

/* ---- 推荐 ---- */
.verdict{background:#2b2118;color:var(--cream);border-radius:14px;
 padding:11px 14px;font-size:13px;margin-bottom:12px}
.pick{background:var(--paper);border:1px solid var(--line);border-radius:16px;
 padding:13px 14px;margin-bottom:11px;position:relative;
 box-shadow:0 3px 10px rgba(43,33,24,.06)}
.pick.first{border-color:var(--gold);border-width:2px}
.rk{position:absolute;right:12px;top:11px;font:700 12px/1 sans-serif;
 color:#fff;background:var(--gold);padding:4px 9px;border-radius:11px}
.pick.first .rk{background:var(--red)}
.nm{font-size:17px;font-weight:700;padding-right:66px;line-height:1.35}
.meta{display:flex;gap:9px;flex-wrap:wrap;font-size:12px;color:var(--ink2);
 margin:6px 0 8px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:11px;background:var(--cream);border:1px solid var(--line);
 border-radius:20px;padding:2px 8px;color:var(--ink2)}
.why{margin:0;padding:0;list-style:none;font-size:12px}
.why li{display:flex;gap:7px;margin-bottom:3px;padding-left:7px;
 border-left:3px solid transparent}
.why li.k-almanac{border-left-color:#d9b25c}
.why li.k-history{border-left-color:#5aa7e0}
.why li.k-budget{border-left-color:#b39ddb}
.why .d{font-weight:700;min-width:38px;text-align:right;
 font-variant-numeric:tabular-nums}
.why .up{color:var(--ok)} .why .dn{color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.acts a{font-size:12px;color:var(--red);text-decoration:none;
 border:1px solid var(--line);border-radius:18px;padding:4px 11px;background:#fff}
.bar{display:flex;gap:9px;align-items:center;margin:4px 0 16px;flex-wrap:wrap}
button{font:inherit;font-size:14px;border:0;border-radius:22px;
 background:var(--red);color:#fff;padding:10px 18px;cursor:pointer}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.note{background:#fff8e6;border:1px solid #f0dda6;border-radius:13px;
 padding:10px 13px;font-size:12px;color:#7a5c14;margin-top:18px;line-height:1.7}
.dt{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:12px}
.dt input{font:inherit;padding:7px 10px;border:1px solid var(--line);
 border-radius:10px;background:#fff}
.muted{color:var(--ink2)}
</style>
</head>

  <div id="almBox"></div>

  <div id="pickBox"></div>
  <div class="bar">
    <button id="roll">🎲 换一批</button>
    <span class="muted" id="rollNote"></span>
  </div>
  <div class="note" id="note"></div>
</main>

var S = {i:0, off:0};
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,
  function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function today(){
  var t = new Date(); t.setHours(12,0,0,0);
  var s = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')
        +'-'+String(t.getDate()).padStart(2,'0');
  for(var i=0;i<DATA.length;i++){ if(DATA[i].a.date===s) return i; }
  return 0;
}

function renderAlm(a){
  var yi = (a.eat_good||[]).slice(0,3), ji = (a.eat_bad||[]).slice(0,3);
  var day = a.date.slice(8);
  $('#almBox').innerHTML =
   '<div class="alm">'
   +'<div class="top"><span>'+esc(a.year8char)+'年 · '+esc(a.zodiac_year)+'年</span>'
   +'<span>'+esc(a.season||'')+(a.solar_term?' · '+esc(a.solar_term):'')+'</span></div>'
   +'<div class="mid">'
     +'<div class="col"><div>农历</div><div style="font-size:15px;color:var(--ink)">'
       +esc(a.lunar_full)+'</div><div>'+esc(a.day8char)+'日</div></div>'
     +'<div class="day"><div class="n">'+esc(day)+'</div>'
       +'<div class="w">'+esc(a.weekday)+'</div></div>'
     +'<div class="col"><div>值星</div>'
       +'<div style="font-size:20px;color:var(--red);font-weight:700">'+esc(a.officer)+'</div>'
       +'<div>'+esc(a.dao)+'</div></div>'
   +'</div>'
   +'<div class="tone">'+esc(a.officer_tone)+'</div>'
   +'<div class="yiji">'
     +'<div class="y"><h4>宜</h4><ul>'
       +yi.map(function(x){ return '<li>'+esc(short(x))+'</li>'; }).join('')+'</ul></div>'
     +'<div class="j"><h4>忌</h4><ul>'
       +ji.map(function(x){ return '<li>'+esc(short(x))+'</li>'; }).join('')+'</ul></div>'
   +'</div>'
   +'<div class="foot"><span>日五行 '+esc(a.wuxing)+'</span>'
     +'<span>'+esc(a.slot_hour)+' '+esc(a.slot_luck)+'</span>'
     +'<span>'+esc(a.level)+'</span>'
     +'<span>吃运 '+esc(a.luck_score)+'</span></div>'
   +'</div>';
}

/* 宜忌原文太长，手机上一行放不下，压成短句（跟桌面挂件同一套规则） */
function short(s){
  var t = String(s||'').replace(/^[宜忌]/,'');
  var seps = ['：','、','，'];
  for(var i=0;i<seps.length;i++){
    if(t.indexOf(seps[i])>=0){
      var h = t.split(seps[i])[0];
      if(h.length>=4){ t=h; break; }
    }
  }
  return t.length<=12 ? t : t.slice(0,12)+'…';
}

function renderPicks(d){
  var n = d.s.length;
  var show = [];
  for(var k=0;k<3 && k<n;k++) show.push(d.s[(S.off*3+k) % n]);
  $('#verdictBox').innerHTML = '<div class="verdict">📜 '+esc(d.v)+'</div>';
  $('#pickBox').innerHTML = show.map(function(p,i){
    var q = encodeURIComponent(p.n);
    return '<div class="pick'+(i===0?' first':'')+'">'
      +'<div class="rk">'+(i===0?'主推':'备选'+(i+1))+'</div>'
      +'<div class="nm">'+esc(p.n)+'</div>'
      +'<div class="meta"><span>'+esc(p.c||'未分类')+'</span>'
        +'<span>人均 ¥'+p.p+'</span><span>步行 '+p.w+' 分钟</span>'
        +(p.d?'<span>'+esc(p.d)+'</span>':'')+'</div>'
      +'<div class="chips">'+(p.t||[]).map(function(t){
          return '<span class="chip">'+esc(t)+'</span>'; }).join('')+'</div>'
      +'<ul class="why">'+(p.r||[]).map(function(r){
          return '<li class="k-'+esc(r.k||'almanac')+'">'
            +'<span class="d '+(r.d>0?'up':'dn')+'">'+(r.d>0?'+':'')+r.d+'</span>'
            +'<span>'+esc(r.t)+'</span></li>'; }).join('')+'</ul>'
      +'<div class="acts">'
        +'<a target="_blank" rel="noopener" href="https://www.dianping.com/search/keyword/7/0_'+q+'">查团购↗</a>'
        +'<a target="_blank" rel="noopener" href="https://map.amap.com/search?query='+q+'">看地图↗</a>'
      +'</div></div>';
  }).join('');
  $('#rollNote').textContent = '每天 '+n+' 家候选，第 '+(S.off+1)+' 批';
}

function render(){
  var d = DATA[S.i];
  $('#date').value = d.a.date;
  renderAlm(d.a);
  renderPicks(d);
}

$('#prev').onclick = function(){ if(S.i>0){ S.i--; S.off=0; render(); } };
$('#next').onclick = function(){ if(S.i<DATA.length-1){ S.i++; S.off=0; render(); } };
$('#date').onchange = function(){
  for(var i=0;i<DATA.length;i++){
    if(DATA[i].a.date===this.value){ S.i=i; S.off=0; render(); return; }
  }
  alert('这个日期不在预生成范围内（'+DATA[0].a.date+' 到 '
        +DATA[DATA.length-1].a.date+'）');
  render();
};
$('#roll').onclick = function(){ S.off = (S.off+1) % Math.ceil(DATA[S.i].s.length/3); render(); };

$('#note').innerHTML =
  '<b>这是静态版，能做和不能做的：</b><br>'
  +'能看黄历、能看每天推荐的三家（'+META.shops+' 家餐厅里挑的）、能换一批、'
  +'能翻到以后任何一天。<br>'
  +'<b>不能</b>投票、不能记"大家吃了什么"、没有周报 —— 那些需要一个能存数据的后端。<br>'
  +'推荐是按"没有历史记录"算的，所以<b>不会避开你们昨天刚吃的那家</b>。<br>'
  +'数据预生成到 '+META.last+'，到期前重新生成一次就行。<br>'
  +'历法用 cnlunar 真算的，宜忌映射到菜系口味是自己定的规则，图个乐。';

S.i = today();
render();
</script>
</body>
</html>
